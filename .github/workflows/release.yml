name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          cp .build/apple/Products/Release/LogicGrooveMCP LogicGrooveMCP
          chmod +x LogicGrooveMCP

      - name: Package
        run: |
          tar czf LogicGrooveMCP-macOS-universal.tar.gz LogicGrooveMCP
          shasum -a 256 LogicGrooveMCP-macOS-universal.tar.gz > SHA256SUMS.txt
          shasum -a 256 LogicGrooveMCP >> SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            LogicGrooveMCP
            LogicGrooveMCP-macOS-universal.tar.gz
            SHA256SUMS.txt
